<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI WIN ALEXANDRES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg-1:#0a0612;--bg-2:#1a0b2e;--glass-bg:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.12);--glass-hover:rgba(255,255,255,0.08);--text-1:#fff;--text-2:#b8b8d1;--text-3:#7a7a99;--accent-1:#a855f7;--accent-2:#3b82f6;--accent-3:#ec4899;--success:#10b981;--danger:#ef4444}
html,body{height:100%;font-family:'Cairo','Segoe UI',sans-serif;background:var(--bg-1);color:var(--text-1);overflow:hidden}
.bg-wrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(168,85,247,0.35),transparent 50%),radial-gradient(circle at 80% 80%,rgba(59,130,246,0.35),transparent 50%),radial-gradient(circle at 50% 50%,rgba(236,72,153,0.20),transparent 60%),linear-gradient(135deg,#0a0612 0%,#1a0b2e 50%,#050308 100%);background-size:200% 200%,200% 200%,200% 200%,100% 100%;animation:bgShift 18s ease-in-out infinite}
@keyframes bgShift{0%,100%{background-position:0% 0%,100% 100%,50% 50%,0% 0%}50%{background-position:100% 100%,0% 0%,50% 50%,0% 0%}}
.bg-grid{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(168,85,247,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.08) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%)}
.bg-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;font-family:'Cairo',sans-serif;font-weight:900;font-size:clamp(60px,14vw,260px);letter-spacing:12px;color:transparent;background:linear-gradient(90deg,rgba(168,85,247,0.55),rgba(59,130,246,0.55),rgba(236,72,153,0.55),rgba(168,85,247,0.55));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;white-space:nowrap;pointer-events:none;animation:textFlow 8s linear infinite;filter:blur(0.5px);text-align:center;user-select:none}
@keyframes textFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.app{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:16px;gap:12px}
.header{backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border:1px solid var(--glass-border);border-radius:22px;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1)}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#a855f7,#3b82f6,#ec4899);background-size:200% 200%;animation:logoShift 4s ease infinite;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;box-shadow:0 0 24px rgba(168,85,247,0.6);flex-shrink:0}
@keyframes logoShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.title-wrap{flex:1;min-width:180px}
.title{font-size:17px;font-weight:900;background:linear-gradient(90deg,#a855f7,#3b82f6,#ec4899,#a855f7);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:textFlow 6s linear infinite;letter-spacing:1px}
.subtitle{font-size:11px;color:var(--text-3);margin-top:2px;letter-spacing:0.5px}
.status{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:100px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.35);font-size:12px;font-weight:600;color:var(--success)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s ease infinite;box-shadow:0 0 12px var(--success)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
.chat-wrap{flex:1;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(255,255,255,0.01));border:1px solid var(--glass-border);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1)}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-track{background:transparent}
.chat::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#a855f7,#3b82f6);border-radius:8px}
.msg{display:flex;gap:12px;animation:msgIn 0.35s cubic-bezier(0.16,1,0.3,1);max-width:88%}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;flex-direction:row-reverse;margin-left:auto}
.msg.ai{align-self:flex-start}
.avatar{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff}
.msg.user .avatar{background:linear-gradient(135deg,#3b82f6,#06b6d4);box-shadow:0 0 18px rgba(59,130,246,0.5)}
.msg.ai .avatar{background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 0 18px rgba(168,85,247,0.5);animation:logoShift 4s ease infinite;background-size:200% 200%}
.bubble{padding:12px 18px;border-radius:18px;font-size:14.5px;line-height:1.7;word-wrap:break-word;overflow-wrap:break-word;position:relative}
.msg.user .bubble{background:linear-gradient(135deg,rgba(59,130,246,0.22),rgba(6,182,212,0.15));border:1px solid rgba(59,130,246,0.35);border-top-right-radius:6px;color:#e0f2fe}
.msg.ai .bubble{background:linear-gradient(135deg,rgba(168,85,247,0.18),rgba(236,72,153,0.12));border:1px solid rgba(168,85,247,0.3);border-top-left-radius:6px;color:#f3e8ff}
.bubble p{margin-bottom:8px}
.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{padding-right:22px;margin-bottom:8px}
.bubble li{margin-bottom:4px}
.bubble code{font-family:'JetBrains Mono',monospace;background:rgba(0,0,0,0.5);padding:2px 7px;border-radius:5px;font-size:12.5px;color:#fbbf24}
.bubble pre{background:rgba(0,0,0,0.6)!important;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px;overflow-x:auto;margin:10px 0;direction:ltr;text-align:left}
.bubble pre code{background:transparent;padding:0;color:inherit;font-size:12.5px;line-height:1.6}
.bubble h1,.bubble h2,.bubble h3{margin:12px 0 8px;color:#fff}
.bubble h1{font-size:20px}
.bubble h2{font-size:17px}
.bubble h3{font-size:15px}
.bubble a{color:#06b6d4;text-decoration:none;border-bottom:1px dashed}
.bubble strong{color:#fbbf24}
.bubble blockquote{border-right:3px solid #a855f7;padding-right:12px;margin:8px 0;color:var(--text-2);font-style:italic}
.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing span{width:8px;height:8px;border-radius:50%;background:#a855f7;animation:typingBounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s;background:#3b82f6}
.typing span:nth-child(3){animation-delay:0.4s;background:#ec4899}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-8px);opacity:1}}
.input-wrap{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--glass-border);background:rgba(0,0,0,0.25);align-items:flex-end}
textarea{flex:1;resize:none;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:16px;padding:12px 16px;color:#fff;font-family:inherit;font-size:14px;line-height:1.5;outline:none;max-height:140px;min-height:48px;transition:all 0.25s ease}
textarea:focus{border-color:var(--accent-1);background:rgba(255,255,255,0.08);box-shadow:0 0 24px rgba(168,85,247,0.25)}
textarea::placeholder{color:var(--text-3)}
button{border:none;border-radius:14px;padding:12px 20px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.25s ease;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.send-btn{background:linear-gradient(135deg,#a855f7,#3b82f6);color:#fff;min-width:100px;height:48px;box-shadow:0 4px 20px rgba(168,85,247,0.4)}
.send-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 28px rgba(168,85,247,0.6)}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}
.clear-btn{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3);height:48px;padding:0 14px}
.clear-btn:hover{background:rgba(239,68,68,0.25);border-color:rgba(239,68,68,0.6)}
.welcome{text-align:center;padding:30px 20px;color:var(--text-2);animation:msgIn 0.5s ease}
.welcome h2{font-size:22px;margin-bottom:8px;background:linear-gradient(90deg,#a855f7,#3b82f6,#ec4899);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:textFlow 6s linear infinite}
.welcome p{font-size:13px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.chip{padding:8px 16px;border-radius:100px;background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer;transition:all 0.25s ease}
.chip:hover{background:var(--glass-hover);border-color:var(--accent-1);color:#fff;transform:translateY(-2px)}
@media(max-width:640px){.app{padding:10px;gap:8px}.header{padding:12px;border-radius:18px;gap:10px}.title{font-size:14px}.subtitle{display:none}.logo{width:40px;height:40px;font-size:18px}.status span:not(.status-dot){display:none}.status{padding:6px 10px}.chat{padding:14px;gap:12px}.msg{max-width:95%}.bubble{padding:10px 14px;font-size:13.5px}.avatar{width:34px;height:34px;font-size:14px}.input-wrap{padding:10px}.send-btn{min-width:70px;padding:12px}.send-btn span{display:none}.bg-text{font-size:15vw;letter-spacing:6px}}
</style>
</head>
<body>

<div class="bg-wrap"></div>
<div class="bg-grid"></div>
<div class="bg-text">AI WIN ALEXANDRES</div>

<div class="app">
  <div class="header">
    <div class="logo">AI</div>
    <div class="title-wrap">
      <div class="title">AI WIN ALEXANDRES</div>
      <div class="subtitle">Free Unlimited AI Assistant</div>
    </div>
    <div class="status" id="statusBox">
      <span class="status-dot"></span>
      <span id="statusText">متصل</span>
    </div>
  </div>

  <div class="chat-wrap">
    <div class="chat" id="chat"></div>
    <div class="input-wrap">
      <textarea id="input" placeholder="اكتب رسالتك هنا... (Enter للإرسال، Shift+Enter لسطر جديد)" rows="1"></textarea>
      <button class="clear-btn" id="clearBtn" title="مسح المحادثة">🗑️</button>
      <button class="send-btn" id="sendBtn">إرسال <span>➤</span></button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "ai_win_alexandres_chat";

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");
const statusText = document.getElementById("statusText");
const statusBox = document.getElementById("statusBox");

let messages = [];
let isGenerating = false;

marked.setOptions({ breaks: true, gfm: true });

function loadState(){
  try{
    const s = localStorage.getItem(STORAGE_KEY);
    if(s) messages = JSON.parse(s);
  }catch(e){}
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-50)));
  }catch(e){}
}

function renderWelcome(){
  chatEl.innerHTML = `
    <div class="welcome">
      <h2>✨ أهلاً بك في AI WIN ALEXANDRES ✨</h2>
      <p>مساعد ذكي مجاني — يساعدك في البرمجة، الكتابة، التحليل، وأي شيء</p>
      <p style="font-size:11px;color:var(--text-3);margin-top:10px;">ابدأ المحادثة من الأسفل 👇</p>
      <div class="chips">
        <div class="chip" data-prompt="اكتبلي كود Python لسحب بيانات من موقع">🐍 كود Python</div>
        <div class="chip" data-prompt="اشرحلي مفاهيم الـ Machine Learning ببساطة">🧠 شرح ML</div>
        <div class="chip" data-prompt="اكتبلي مقال احترافي عن الذكاء الاصطناعي">✍️ مقال</div>
        <div class="chip" data-prompt="ساعدني في حل مشكلة برمجية: ">💡 حل مشكلة</div>
      </div>
    </div>`;
  bindChips();
}

function bindChips(){
  chatEl.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click",()=>{
      inputEl.value = c.dataset.prompt;
      inputEl.focus();
      autoResize();
    });
  });
}

function renderMessage(role,content){
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role==="user"?"user":"ai");
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role==="user"?"أنا":"AI";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if(role==="user"){
    bubble.textContent = content;
  }else{
    try{
      let html = marked.parse(content||"");
      html = DOMPurify.sanitize(html,{ADD_ATTR:['target']});
      bubble.innerHTML = html;
      bubble.querySelectorAll("pre code").forEach(el=>{
        try{hljs.highlightElement(el);}catch(e){}
      });
    }catch(e){
      bubble.textContent = content;
    }
  }
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderAll(){
  if(messages.length===0){ renderWelcome(); return; }
  chatEl.innerHTML = "";
  messages.forEach(m=>renderMessage(m.role,m.content));
  chatEl.scrollTop = chatEl.scrollHeight;
}

function autoResize(){
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight,140)+"px";
}
inputEl.addEventListener("input",autoResize);

function showTyping(){
  const wrap = document.createElement("div");
  wrap.className = "msg ai";
  wrap.id = "typing-indicator";
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "AI";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById("typing-indicator");
  if(el) el.remove();
}

function setStatus(text, ok=true){
  statusText.textContent = text;
  statusBox.style.background = ok ? "rgba(16,185,129,0.12)" : "rgba(239,68,68,0.12)";
  statusBox.style.borderColor = ok ? "rgba(16,185,129,0.35)" : "rgba(239,68,68,0.35)";
  statusBox.style.color = ok ? "#10b981" : "#ef4444";
}

// ============ AI CORE ============
// KeylessAI: مجاني 100% بدون API key، CORS مفتوح
// Fallback: Pollinations (مجاني أيضاً)

const SYSTEM_PROMPT = "You are AI WIN ALEXANDRES — a helpful, unlimited AI assistant. Expert in programming (all languages), mathematics, science, writing, and analysis. Reply in the user's language (Arabic if Arabic, English if English). Be concise and accurate. For code, always output complete working code in markdown blocks.";

async function callKeylessAI(msgs){
  const conversation = [
    { role: "system", content: SYSTEM_PROMPT },
    ...msgs.slice(-10).map(m => ({ role: m.role, content: m.content }))
  ];

  const r = await fetch("https://keylessai.thryx.workers.dev/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      messages: conversation,
      stream: false
    })
  });

  if(!r.ok) throw new Error("KeylessAI HTTP " + r.status);
  const data = await r.json();
  const txt = data.choices?.[0]?.message?.content;
  if(!txt) throw new Error("KeylessAI: رد فارغ");
  return txt;
}

async function callPollinations(msgs){
  const context = msgs.slice(-8).map(m=>{
    const label = m.role==="user" ? "User" : "Assistant";
    return `${label}: ${m.content}`;
  }).join("\n\n");
  const fullPrompt = `${SYSTEM_PROMPT}\n\n${context}\n\nAssistant:`;
  const encoded = encodeURIComponent(fullPrompt);
  const seed = Math.floor(Math.random()*999999);
  const url = `https://text.pollinations.ai/${encoded}?model=openai&seed=${seed}`;
  const r = await fetch(url, {method: "GET"});
  if(!r.ok) throw new Error("Pollinations HTTP " + r.status);
  const text = await r.text();
  if(!text || text.trim().length < 2) throw new Error("Pollinations: رد فارغ");
  return text.trim();
}

async function callAI(msgs){
  const attempts = [
    { name: "KeylessAI", fn: () => callKeylessAI(msgs) },
    { name: "Pollinations", fn: () => callPollinations(msgs) }
  ];

  let lastError = null;
  for(const attempt of attempts){
    try{
      setStatus("جاري التفكير...", true);
      const reply = await attempt.fn();
      if(reply && reply.trim().length > 0){
        setStatus("متصل", true);
        return reply.trim();
      }
    }catch(err){
      lastError = err;
      console.warn(`${attempt.name} فشل:`, err.message || err);
    }
  }
  setStatus("خطأ", false);
  throw new Error(lastError ? (lastError.message || String(lastError)) : "كل المحاولات فشلت");
}

// ============ SEND ============
async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text || isGenerating) return;

  isGenerating = true;
  sendBtn.disabled = true;

  if(messages.length===0) chatEl.innerHTML = "";

  messages.push({role:"user",content:text});
  renderMessage("user",text);
  saveState();

  inputEl.value = "";
  autoResize();
  showTyping();

  let reply = "";

  try{
    reply = await callAI(messages);
  }catch(err){
    console.error(err);
    reply = `❌ **تعذر الحصول على رد.**\n\n**السبب:** \`${String(err).slice(0,150)}\`\n\n💡 **حاول:**\n• إعادة المحاولة بعد ثواني\n• إعادة تحميل الصفحة`;
  }

  hideTyping();

  if(!reply || !reply.trim()){
    reply = "❌ لم يصل رد. جرب تاني.";
  }

  messages.push({role:"assistant",content:reply});
  renderMessage("assistant",reply);
  saveState();

  isGenerating = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener("click",sendMessage);

inputEl.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

clearBtn.addEventListener("click",()=>{
  if(messages.length===0) return;
  if(!confirm("مسح المحادثة بالكامل؟")) return;
  messages = [];
  localStorage.removeItem(STORAGE_KEY);
  renderAll();
});

// ============ INIT ============
loadState();
renderAll();
autoResize();
inputEl.focus();
</script>
</body>
  </html>
